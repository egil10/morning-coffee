name: Morning Coffee

on:
  schedule:
    # TEMPORARY TEST — every 10 minutes. When done, delete this line and
    # uncomment the normal one below.
    - cron: "*/10 * * * *"
    # - cron: "0 6 * * 1-5"   # normal: weekdays 06:00 UTC (~07-08 Oslo)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: sample digest, no Claude, no email, no commit (just builds + uploads a preview)"
        type: boolean
        default: false

# contents: write lets the default GITHUB_TOKEN commit the new newsletter back;
# id-token: write lets the Claude Code Action mint its OIDC token.
permissions:
  contents: write
  id-token: write

# Never let two brews overlap.
concurrency:
  group: morning-coffee
  cancel-in-progress: false

jobs:
  brew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # ---------- dry run: sample data, no token, no email, no commit ----------
      - name: Generate (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python generate.py --sample

      - name: Upload preview
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: morning-coffee-preview
          path: docs/newsletters/

      # ---------- live: Claude (your subscription) gathers the jobs, Python ships it ----------
      - name: Gather job postings with Claude
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth — generated locally with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Swap to --model claude-opus-4-8 for richer summaries (uses more of your plan).
          claude_args: "--allowedTools WebFetch,WebSearch,Write,Read,Edit --max-turns 40 --model claude-sonnet-4-6"
          prompt: |
            You are a job-scouting assistant. Using the WebFetch tool, fetch each of
            these pages and extract the most recent job and internship postings you can
            actually find on them:
              - https://bindeleddet.no/jobs/
              - https://nu.nhhs.no/en/jobs/
              - https://www.finn.no/job/search?q=finans

            For each posting capture: the role title, the employer/company, the location
            and any application deadline, the direct link, and a one-sentence summary.
            Group postings by source site (about the 6 most recent/relevant per source).
            Only include postings you genuinely found on the pages — NEVER invent or
            guess listings. If a page will not load or has nothing usable, include that
            source with an empty "items" list.

            Save the result with the Write tool to a file named exactly `data.json` in
            the repository root, containing ONLY valid JSON (no markdown, no prose, no
            code fences) in exactly this shape:
            {
              "title": "Job Radar",
              "intro": "one or two sentences summarising today's pickings",
              "sections": [
                {
                  "heading": "Bindeleddet",
                  "items": [
                    {
                      "title": "role title",
                      "subtitle": "employer / company",
                      "meta": "location · deadline (if any)",
                      "summary": "one sentence on the role",
                      "url": "direct link to the posting"
                    }
                  ]
                }
              ],
              "sources": ["bindeleddet.no/jobs", "nu.nhhs.no/en/jobs", "finn.no/job (finans)"]
            }

            Do not commit, push, or open a pull request — only write the file.

      - name: Render, email & archive
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Sender is the bot Gmail; always deliver to your personal inbox.
          RECIPIENT: ${{ vars.RECIPIENT || 'egilfure@gmail.com' }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}   # optional; defaults to the Pages URL
        run: python generate.py --from-json data.json

      - name: Commit & push the new edition
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit."
          else
            git commit -m "Morning Coffee: $(date -u +%Y-%m-%d)"
            # Push with the Actions token explicitly — the Claude Code Action
            # disturbs the checkout's persisted git credentials.
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
