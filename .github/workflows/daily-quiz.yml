name: Morning Coffee

on:
  schedule:
    # 05:50 UTC = 07:50 in Oslo while it's on CEST (GMT+02, summer).
    # NOTE: GitHub cron is UTC with no DST. When Oslo returns to CET (GMT+01,
    # ~late October) this fires at 06:50 local — change to "50 6 * * *" then.
    - cron: "50 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: sample digest, no Claude, no email, no commit (just builds + uploads a preview)"
        type: boolean
        default: false

# contents: write lets the default GITHUB_TOKEN commit the new newsletter back;
# id-token: write lets the Claude Code Action mint its OIDC token.
permissions:
  contents: write
  id-token: write

# Never let two brews overlap.
concurrency:
  group: morning-coffee
  cancel-in-progress: false

jobs:
  brew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # ---------- dry run: sample data, no token, no email, no commit ----------
      - name: Generate (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python generate.py --sample

      - name: Upload preview
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: morning-coffee-preview
          path: docs/newsletters/

      # ---------- live: Claude (your subscription) gathers the headlines, Python ships it ----------
      - name: Gather top headlines with Claude
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth — generated locally with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Swap to --model claude-opus-4-8 for richer summaries (uses more of your plan).
          claude_args: "--allowedTools WebSearch,WebFetch,Write,Read,Edit --max-turns 30 --model claude-sonnet-4-6"
          prompt: |
            You are a news editor. Using the WebSearch tool, find the 5 most important
            news stories from the last 24 hours worldwide — spanning politics, the
            economy and markets, science and technology, and major world events. Pick
            the five most significant overall (not five from one topic).

            For each story capture: a clear headline, the outlet/source, roughly how
            long ago it broke, a one or two sentence summary of what happened and why it
            matters, and a link. Only include real stories actually reported in the last
            24 hours — never invent or pad to reach five.

            Save the result with the Write tool to a file named exactly `data.json` in
            the repository root, containing ONLY valid JSON (no markdown, no prose, no
            code fences) in exactly this shape:
            {
              "title": "Morning Headlines",
              "intro": "one sentence setting up the day's top stories",
              "sections": [
                {
                  "heading": "Top 5 · last 24 hours",
                  "items": [
                    {
                      "title": "the headline",
                      "subtitle": "outlet / source",
                      "meta": "~Xh ago · region or topic",
                      "summary": "one or two sentences: what happened and why it matters",
                      "url": "link to the story"
                    }
                  ]
                }
              ],
              "sources": ["outlets you drew from"]
            }

            Exactly 5 items, most important first. Do not commit, push, or open a
            pull request — only write the file.

      - name: Render, email & archive
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Sender is the bot Gmail; always deliver to your personal inbox.
          RECIPIENT: ${{ vars.RECIPIENT || 'egilfure@gmail.com' }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}   # optional; defaults to the Pages URL
        run: python generate.py --from-json data.json

      - name: Commit & push the new edition
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit."
          else
            git commit -m "Morning Coffee: $(date -u +%Y-%m-%d)"
            # Push with the Actions token explicitly — the Claude Code Action
            # disturbs the checkout's persisted git credentials.
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
